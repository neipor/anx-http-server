# ANX Web Server Configuration
# ============================
# All available configuration directives

# Server Basics
port=18080
root=./www

# Worker Configuration
worker_processes=4

# Timeouts
keepalive_timeout=65

# Request Limits
client_max_body_size=1048576

# Server Identity
server_tokens=on

# Directory Listing
autoindex=on

# Compression
gzip_static=off

# Logging
# access_log=/var/log/anx/access.log

# Reverse Proxy (uncomment to enable)
# upstream_ip=127.0.0.1
# upstream_port=9005
